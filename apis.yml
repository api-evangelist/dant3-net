- aid: dant3-net:dant3-discovery-agent
  name: Dant3 Discovery Agent (A2A)
  description: 'A2A 1.0 agent (JSON-RPC binding) that returns machine-readable entry points for the Dant3 network,
    machine onboarding instructions and public work discovery. Three skills: discover-dant3, onboard-machine, discover-work.
    Synchronous SendMessage only; no streaming, push notifications or persistent tasks; no model inference on the
    discovery path.'
  humanURL: https://dant3.net/skill.md
