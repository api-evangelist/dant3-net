conformance:
  spec: A2A 1.0.0
  grade: conformant
  protocol_version: '1.0'
  preferred_transport: JSONRPC
  deviations:
  - protocolVersion-per-interface
  - capabilities.extendedAgentCard-nonstandard-key
grade_basis: 'Graded against the A2A 1.0.0 AgentCard object: capabilities is an OBJECT (pass), skills is an ARRAY
  of 3 skills each with id/name/description/tags/examples (pass), protocolVersion is present (pass) — declared as
  supportedInterfaces[0].protocolVersion = "1.0", which is where the 1.0.0 schema places it (the top-level url/preferredTransport/additionalInterfaces/protocolVersion
  fields of 0.3 were folded into supportedInterfaces[] in 1.0). Optional defaultInputModes and defaultOutputModes
  are declared; protocolBinding JSONRPC stands in for the 0.3 preferredTransport. The live endpoint corroborates
  the version claim: it rejects 0.3-shaped requests by name and answers a 1.0 SendMessage.'
deviations:
- field: protocolVersion
  observed: absent at top level; present as supportedInterfaces[0].protocolVersion = "1.0"
  note: Correct for A2A 1.0.0. A reader applying the 0.3-era top-level check would miss it; recorded so the grade
    is auditable.
- field: capabilities.extendedAgentCard
  observed: false
  note: Not a 1.0.0 capabilities key; the 1.0 field is top-level supportsAuthenticatedExtendedCard. Harmless extra
    key, no functional impact.
- field: securitySchemes
  observed: absent
  note: Consistent with the provider's statement that A2A discovery is anonymous; the endpoint answered without
    credentials.
- field: capabilities.streaming / pushNotifications
  observed: false
  note: Provider states streaming, push notifications, persistent Tasks and extended cards are not supported; only
    synchronous SendMessage discovery/onboarding responses.
